name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 45
    # npm trusted publishing trusts this workflow file and environment; the environment requires approval.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: arm64
      - name: Install release tool dependencies
        run: npm ci --ignore-scripts
      - name: Test audit rules
        run: npm test
      - name: Build and audit the package
        run: npm run build
      - name: Reject the earlier 1.13.8 and 1.13.8-mt.1 binaries
        run: npm run negative-control
      - name: Publish the audited tarball with provenance
        run: node release.mjs publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: published-${{ github.sha }}
          path: |
            dist/*.tgz
            dist/audit.json
            dist/evidence/
          if-no-files-found: warn
          retention-days: 90
