name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: main, runner: ubuntu-24.04, arch: x64, file: node }
          - { target: win-x64, runner: windows-2025, arch: x64, file: win-x64 }
          - { target: win-arm64, runner: windows-11-arm, arch: arm64, file: win-arm64 }
          - { target: darwin-arm64, runner: macos-15, arch: arm64, file: darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      # Every cached file is named by and checked against its pinned SHA-256 before use.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: inputs-${{ matrix.target }}-${{ hashFiles('lock.json') }}
      - name: Install release tool dependencies
        run: npm ci --ignore-scripts
      - name: Test audit rules
        run: npm test
      - name: Build, audit and smoke-test the package
        run: node release.mjs build ${{ matrix.target }}
      - name: Transcribe the upstream sample with SenseVoice and Silero VAD
        if: matrix.target != 'main'
        run: node accept.mjs ${{ matrix.target }}
      - name: Load upstream's Linux x64 package through the passthrough alias
        if: matrix.target == 'main'
        run: node passthrough-smoke.mjs
      - name: Reject the earlier 1.13.8 and 1.13.8-mt.1 binaries
        if: matrix.target == 'win-arm64'
        run: npm run negative-control
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/yudshj-sherpa-onnx-${{ matrix.file }}-*.tgz
            dist/audit-${{ matrix.target }}.json
            dist/evidence/
          if-no-files-found: error
          retention-days: 14
